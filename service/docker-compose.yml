services:
  firstcall:
    build:
      context: ..
      dockerfile: service/Dockerfile.compose
    ports:
      - "8080:8080"
    environment:
      SAHIIXX_DB: /data/sahiixx_revenue.db
    volumes:
      - firstcall_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  firstcall_data:
