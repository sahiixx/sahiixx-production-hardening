# Pending activation: place this template at .github/workflows/revenue-path.yml.
# Publishing an active workflow requires GitHub credentials with workflow scope.
name: Revenue path

on:
  pull_request:
    paths:
      - 'service/**'
      - 'stubs/python/**'
      - '.github/workflows/revenue-path.yml'
  push:
    branches: [main]
    paths:
      - 'service/**'
      - 'stubs/python/**'
      - '.github/workflows/revenue-path.yml'

permissions:
  contents: read

jobs:
  revenue-path:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      SAHIIXX_DB: ${{ runner.temp }}/unused-revenue.db
      TMPDIR: ${{ runner.temp }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.3'
          cache: pip
          cache-dependency-path: |
            service/requirements.txt
            service/requirements-test.txt
      - name: Install pinned test dependencies
        run: |
          python -m pip install pip==26.2.1
          python -m pip install -r service/requirements-test.txt
          python -m pip check
      - name: Run offline revenue-path and tenant-isolation tests
        run: python -m unittest discover -s service -p 'test_*.py' -v
